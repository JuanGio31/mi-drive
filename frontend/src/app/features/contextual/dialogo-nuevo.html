<h2 mat-dialog-title>{{ titulo() }}</h2>

<mat-dialog-content>
  <p class="destino">Se creará en {{ datos.destino }}.</p>

  <mat-form-field appearance="outline" class="campo">
    <mat-label>Nombre</mat-label>
    <input
      #campo
      matInput
      [ngModel]="nombre()"
      (ngModelChange)="nombre.set($event)"
      (keydown.enter)="crear()"
      (focus)="seleccionar($event)"
      [disabled]="creando()"
      autocomplete="off"
      cdkFocusInitial
    />
    @if (extension(); as ext) {
      <span matTextSuffix class="sufijo">{{ ext }}</span>
    }
  </mat-form-field>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancelar()" [disabled]="creando()">
    Cancelar
  </button>
  <button
    mat-flat-button
    type="button"
    [disabled]="!valido() || creando()"
    (click)="crear()"
  >
    @if (creando()) {
      <mat-spinner diameter="18" class="spinner"></mat-spinner>
    }
    Crear
  </button>
</mat-dialog-actions>
