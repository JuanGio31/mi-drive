<h2 mat-dialog-title>{{ datos.titulo }}</h2>

<mat-dialog-content>
  <p class="mensaje">{{ datos.mensaje }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cerrar(false)">Cancelar</button>
  <button
    mat-flat-button
    type="button"
    [color]="datos.peligroso ? 'warn' : 'primary'"
    (click)="cerrar(true)"
  >
    {{ datos.textoConfirmar || 'Aceptar' }}
  </button>
</mat-dialog-actions>
