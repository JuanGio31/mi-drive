<h2 mat-dialog-title>Renombrar {{ datos.tipo }}</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" class="campo">
    <mat-label>Nombre</mat-label>
    <input
      matInput
      [(ngModel)]="nombre"
      (keydown.enter)="confirmar()"
      autocomplete="off"
      cdkFocusInitial
    />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
  <button
    mat-flat-button
    type="button"
    [disabled]="!valido"
    (click)="confirmar()"
  >
    Guardar
  </button>
</mat-dialog-actions>
